spring.application.name=backend
server.port=8081
# Database (MySQL) - values come from environment variables, no secrets committed
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# ddl-auto=update: acceptable for local development in this phase so schema evolves with entities.
# Will move to a proper migration tool (e.g. Flyway) before production use.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT configuration - secret must be provided via environment variable, never hardcoded
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
