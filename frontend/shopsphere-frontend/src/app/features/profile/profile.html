<section class="profile-page">
  <h1>My Profile</h1>

  @if (currentUser(); as user) {
    <div class="profile-summary">
      <p class="profile-name">{{ user.name }}</p>
      <p>{{ user.email }}</p>
      <p>{{ user.phone }}</p>
    </div>
  }

  <nav class="profile-links">
    <a routerLink="/profile/addresses">Manage Addresses</a>
  </nav>
</section>
