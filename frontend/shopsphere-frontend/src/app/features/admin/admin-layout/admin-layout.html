<div class="admin-container">
  <aside class="admin-sidebar">
    <div class="admin-branding">
      <h1>ShopSphere Admin</h1>
    </div>
    <nav class="admin-nav">
      <ul>
        <li>
          <a routerLink="/admin" routerLinkActive="active">Dashboard</a>
        </li>
        <li>
          <a routerLink="/admin/products" routerLinkActive="active">Products</a>
        </li>
        <li>
          <a routerLink="/admin/categories" routerLinkActive="active">Categories</a>
        </li>
        <li>
          <a routerLink="/admin/inventory" routerLinkActive="active">Inventory</a>
        </li>
        <li>
          <a routerLink="/admin/orders" routerLinkActive="active">Orders</a>
        </li>
        <li>
          <a routerLink="/admin/users" routerLinkActive="active">Customers</a>
        </li>
      </ul>
    </nav>
    <div class="admin-sidebar-footer">
      <button type="button" class="logout-button" (click)="logout()">
        Logout
      </button>
    </div>
  </aside>
  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
