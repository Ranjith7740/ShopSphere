<div class="container">
  <div class="header">
    <h1>{{ isEditMode() ? 'Edit Product' : 'Add New Product' }}</h1>
    <a routerLink="/admin/products" class="btn-secondary">Back to Products</a>
  </div>

  <div *ngIf="loading()" class="loading-overlay">
    <p>Loading product...</p>
  </div>

  <div *ngIf="errorMessage()" class="error-message">
    {{ errorMessage() }}
  </div>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="product-form">
    <div class="form-group">
      <label for="name">Product Name *</label>
      <input id="name" formControlName="name" type="text" placeholder="Enter product name">
      <div *ngIf="productForm.get('name')?.touched && productForm.get('name')?.errors?.['required']" class="error">
        Product name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" placeholder="Enter product description"></textarea>
    </div>

    <div class="form-group">
      <label for="categoryId">Category *</label>
      <select id="categoryId" formControlName="categoryId">
        <option value="" disabled>Select a category</option>
        <option *ngFor="let cat of categories()" [value]="cat.id">{{ cat.name }}</option>
      </select>
      <div *ngIf="productForm.get('categoryId')?.touched && productForm.get('categoryId')?.errors?.['required']" class="error">
        Category is required.
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="price">Price *</label>
        <input id="price" formControlName="price" type="number" min="0" step="0.01" placeholder="0.00">
        <div *ngIf="productForm.get('price')?.touched && productForm.get('price')?.errors?.['required']" class="error">
          Price is required.
        </div>
        <div *ngIf="productForm.get('price')?.touched && productForm.get('price')?.errors?.['min']" class="error">
          Price must be 0 or greater.
        </div>
      </div>

      <div class="form-group">
        <label for="stockQuantity">Stock Quantity *</label>
        <input id="stockQuantity" formControlName="stockQuantity" type="number" min="0" placeholder="0">
        <div *ngIf="productForm.get('stockQuantity')?.touched && productForm.get('stockQuantity')?.errors?.['required']" class="error">
          Stock quantity is required.
        </div>
        <div *ngIf="productForm.get('stockQuantity')?.touched && productForm.get('stockQuantity')?.errors?.['min']" class="error">
          Stock quantity must be 0 or greater.
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="productForm.invalid || submitting()" class="btn-primary">
        <span *ngIf="!submitting()">{{ isEditMode() ? 'Update Product' : 'Add Product' }}</span>
        <span *ngIf="submitting()">{{ isEditMode() ? 'Updating...' : 'Adding...' }}</span>
      </button>
    </div>
  </form>
</div>
