<a class="product-card" [routerLink]="['/products', product().id]">
  <!-- Placeholder until backend/S3 image support exists - swap for an <img> once ProductResponse carries a URL. -->
  <div class="product-image-placeholder" aria-hidden="true"></div>

  <div class="product-card-body">
    <p class="product-category">{{ product().categoryName }}</p>
    <h2 class="product-name">{{ product().name }}</h2>

    @if (product().description) {
      <p class="product-description">{{ product().description }}</p>
    }

    <div class="product-card-footer">
      <span class="product-price">{{ product().price | number: '1.2-2' }}</span>
      <span class="product-stock" [class.out-of-stock]="!inStock()">
        {{ inStock() ? 'In Stock' : 'Out of Stock' }}
      </span>
    </div>
  </div>
</a>
